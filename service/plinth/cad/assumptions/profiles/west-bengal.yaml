# Location profile: West Bengal. Inherits every value of the national profile; adds the state's local building rules.
# See india-nbc2016.yaml for the rules every profile follows.
id: west-bengal
name: "West Bengal: NBC 2016 with the state's municipal building rules"
extends: india-nbc2016
country: India
states: [West Bengal]
state_aliases: [WB, W.B., Paschimbanga, Paschim Banga]

rule_sets:
  - id: kmc2009
    name: Kolkata Municipal Corporation Building Rules, 2009
    data: kolkata  # Plinth rule file plinth/rules/kolkata.yaml (provisional placeholders, not verified)
    source: "Kolkata Municipal Corporation Building Rules, 2009"
    basis: "Apply within the Kolkata Municipal Corporation area."
  - id: wb-municipal-2007
    name: West Bengal Municipal (Building) Rules, 2007
    data: null  # not in Plinth's rule data yet: compliance checks cannot use it
    source: "West Bengal Municipal (Building) Rules, 2007"
    basis: "Apply in the state's municipalities outside Kolkata; a municipal corporation may have rules of its own (confirm with the sanctioning authority)."

governing:
  places:
    - {places: [Kolkata], use: [nbc2016, kmc2009]}
  default: [nbc2016, wb-municipal-2007]

# Town names, only to suggest a location from drawing text (never set from it). Not a rule source.
places:
