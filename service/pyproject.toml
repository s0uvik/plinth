[project]
name = "plinth"
version = "0.1.0"
description = "Plinth service: talks to the Plinth.Revit add-in"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pyyaml>=6",
    "anthropic>=2.8",
    "mcp>=2.3",
    "reportlab>=4",
    "pypdf>=5",
    "ezdxf>=1.4",
    "openpyxl>=3.1",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pillow>=10"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["plinth*"]

[tool.setuptools.package-data]
plinth = ["rules/*.yaml", "web/*.html", "estimate/rules/*.yaml", "cad/assumptions/profiles/*.yaml",
        "fitout/rulesets/*/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a running Revit with the Plinth add-in and an open scratch project (set PLINTH_LIVE=1)"]
