[project]
name = "b2m"
version = "0.1.0"
description = "B2M Brief-to-Model service: talks to the B2M.Revit add-in"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["b2m*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a running Revit with the B2M add-in and an open scratch project (set B2M_LIVE=1)"]
